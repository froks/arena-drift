<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arena Drift</title>
    <meta name="description" content="A top-down demolition derby made with Rust and Bevy." />

    <!-- Trunk builds the game from Cargo.toml using the size-optimised `web` profile. -->
    <link data-trunk rel="rust" data-bin="arena-drift" data-cargo-profile="web" data-wasm-opt="z" />

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #141418;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      canvas#bevy {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(10, 10, 14, 0.93);
        cursor: pointer;
        user-select: none;
        text-align: center;
        padding: 16px;
      }
      #overlay h1 {
        margin: 0;
        font-size: clamp(32px, 6vw, 64px);
        color: #f2cc4d;
        letter-spacing: 0.06em;
      }
      #overlay p {
        margin: 0;
        opacity: 0.85;
      }
      #overlay .keys {
        font-family: ui-monospace, monospace;
        font-size: 14px;
        opacity: 0.7;
      }
      #overlay.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="bevy" tabindex="0"></canvas>

    <div id="overlay">
      <h1>ARENA DRIFT</h1>
      <p id="status">Loading…</p>
      <p class="keys">
        Garage: Up/Down tier · Left/Right car · Tab arena · Enter race<br />
        Driving: W/S throttle · A/D steer · Space handbrake · F fire
      </p>
    </div>

    <script>
      // Browsers only allow sound after the player interacts with the page,
      // and the canvas needs focus to receive keys. Track every AudioContext
      // the game creates so a click can resume them all.
      const contexts = [];
      const Native = window.AudioContext || window.webkitAudioContext;
      if (Native) {
        window.AudioContext = window.webkitAudioContext = new Proxy(Native, {
          construct(target, args) {
            const ctx = new target(...args);
            contexts.push(ctx);
            return ctx;
          },
        });
      }

      const overlay = document.getElementById("overlay");
      const status = document.getElementById("status");
      const canvas = document.getElementById("bevy");

      // Trunk fires this once the WebAssembly module has loaded.
      addEventListener("TrunkApplicationStarted", () => {
        status.textContent = "Click to play";
      });

      function start() {
        overlay.classList.add("hidden");
        canvas.focus();
        contexts.forEach((ctx) => ctx.state === "suspended" && ctx.resume());
      }
      // index.html#play skips the overlay (sound then starts on the first key press).
      if (location.hash === "#play") overlay.classList.add("hidden");
      overlay.addEventListener("click", start);
      // Clicking the game later (e.g. after switching tabs) refocuses it and wakes the audio.
      canvas.addEventListener("pointerdown", start);
      document.addEventListener("keydown", () => contexts.forEach((ctx) => ctx.state === "suspended" && ctx.resume()));
    </script>
  </body>
</html>
