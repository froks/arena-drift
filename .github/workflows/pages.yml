# Builds the browser version with Trunk and publishes it to GitHub Pages.
name: Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  TRUNK_VERSION: v0.21.14

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Compiled dependencies (registry + target/). Separate key from the native CI
      # builds; only main writes the cache, and failed runs still save it.
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Trunk downloads wasm-bindgen (matching Cargo.lock) and wasm-opt into ~/.cache/trunk.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ env.TRUNK_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: trunk-tools-${{ env.TRUNK_VERSION }}-

      - name: Install Trunk
        run: |
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin trunk
          trunk --version

      # Relative public URL so the build works under /<repo>/ on Pages.
      - name: Build
        run: trunk build --release --public-url ./

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
