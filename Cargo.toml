[package]
name = "arena-drift"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    # Trimmed down so no gamepad/wayland dev packages are needed (audio needs libasound2-dev).
    "default_app", "std", "multi_threaded", "bevy_winit", "x11", "default_font",
    "2d_bevy_render", "ui_api", "ui_bevy_render", "bevy_state",
    "bevy_audio", "wav",
] }

# Small optimizations for our code, full optimizations for dependencies (Bevy is slow in debug).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Browser build (see index.html / `trunk build`): WebGL2 rendering.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["web", "webgl2"] }

# Small, fast WebAssembly for the web build: `trunk build --release` uses this via index.html.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
